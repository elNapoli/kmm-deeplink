rules:
  - id: DOMAIN-ARCHITECTURE-020-usecase-error-package-only-usecaseerrors
    patterns:
      - pattern: |
          package $PKG
          ...
          class $CLASS
      - metavariable-regex:
          metavariable: $PKG
          regex: ^cl\.baldomeronapoli\.\w+\.\w+\.domain\.usecase\.error$
      - pattern-not-regex: 'class\s+\w+\s*:\s*UseCaseError'
    paths:
      exclude:
        - '**/test/**'
        - '**/androidTest/**'
        - '**/commonTest/**'
    languages: [ kotlin ]
    message: '[DOMAIN-ARCHITECTURE-020] En ''domain.usecase.error'' solo se permiten clases que hereden de ''UseCaseError''.'
    severity: ERROR
