[versions]
agp = "8.13.2"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
kotlin = "2.3.0"
kotlinx-coroutines = "1.10.1"
koin = "4.1.1"
napoli-base = "2.0.0"
napoli-navigation = "2.0.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
napoli-kmm-base-domain = { module = "cl.baldomeronapoli:base-kmp-domain", version.ref = "napoli-base" }
napoli-kmm-base-presentation = { module = "cl.baldomeronapoli:base-kmp-presentation", version.ref = "napoli-base" }
napoli-kmm-navigation-domain = { module = "cl.baldomeronapoli:navigation-kmp-domain", version.ref = "napoli-navigation" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
